  /* cozy warm light over everything */
  .desk::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 78% 12%, rgba(255, 214, 150, 0.38), transparent 65%),
      radial-gradient(ellipse 120% 90% at 50% 55%, transparent 55%, rgba(60, 35, 8, 0.38) 100%);
    animation: glowPulse 7s ease-in-out infinite alternate;
  }
  @keyframes glowPulse {
    from { opacity: 0.85; }
    to   { opacity: 1; }
  }

  /* floating dust motes in the warm light */
  .motes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .motes span {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 236, 200, 0.9), rgba(255, 236, 200, 0));
    filter: blur(1px);
    opacity: 0;
    animation: floatUp linear infinite;
  }
  .motes span:nth-child(1) { left: 8%;  bottom: -10px; animation-duration: 16s; }
  .motes span:nth-child(2) { left: 22%; bottom: -10px; animation-duration: 21s; animation-delay: 3s; }
  .motes span:nth-child(3) { left: 37%; bottom: -10px; animation-duration: 14s; animation-delay: 7s; }
  .motes span:nth-child(4) { left: 52%; bottom: -10px; animation-duration: 24s; animation-delay: 1s; }
  .motes span:nth-child(5) { left: 66%; bottom: -10px; animation-duration: 18s; animation-delay: 9s; }
  .motes span:nth-child(6) { left: 78%; bottom: -10px; animation-duration: 15s; animation-delay: 5s; }
  .motes span:nth-child(7) { left: 88%; bottom: -10px; animation-duration: 22s; animation-delay: 11s; }
  .motes span:nth-child(8) { left: 94%; bottom: -10px; animation-duration: 19s; animation-delay: 2s; }
  @keyframes floatUp {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    10%  { opacity: 0.8; }
    50%  { transform: translate(14px, -45vh) scale(0.9); opacity: 0.55; }
    90%  { opacity: 0.15; }
    100% { transform: translate(-10px, -92vh) scale(0.7); opacity: 0; }
  }

  /* steam rising from the coffee cup */
  .steam { position: fixed; right: 3%; bottom: 8%; z-index: 0; pointer-events: none; }
  .steam i {
    position: absolute;
    bottom: 0; left: 0;
    width: 14px; height: 46px;
    border-radius: 50%;
    background: linear-gradient(to top, rgba(255, 248, 235, 0), rgba(255, 248, 235, 0.5));
    filter: blur(6px);
    opacity: 0;
    animation: steamRise 5s ease-in infinite;
  }
  .steam i:nth-child(2) { margin-left: 16px; animation-delay: 1.6s; animation-duration: 5.6s; }
  .steam i:nth-child(3) { margin-left: -14px; animation-delay: 3.2s; animation-duration: 6.2s; }
  @keyframes steamRise {
    0%   { transform: translateY(0) scaleX(1); opacity: 0; }
    15%  { opacity: 0.55; }
    60%  { transform: translateY(-90px) scaleX(1.6) translateX(10px); opacity: 0.3; }
    100% { transform: translateY(-160px) scaleX(2.2) translateX(-6px); opacity: 0; }
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 56px 20px 90px;
  }

  /* --- Notebook --- */
  .notebook {
    position: relative;
    animation: settle 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(26px) rotate(-0.6deg); }
    to   { opacity: 1; transform: translateY(0) rotate(0); }
  }
  .notebook {
    background:
      radial-gradient(ellipse 45% 35% at 12% 8%, rgba(126, 155, 116, 0.10), transparent 70%),
      radial-gradient(ellipse 50% 40% at 88% 90%, rgba(214, 160, 110, 0.10), transparent 70%),
      radial-gradient(ellipse 60% 45% at 55% 45%, rgba(255, 250, 235, 0.5), transparent 75%),
      var(--paper);
    border-radius: 10px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.35) inset,
      0 18px 40px rgba(40, 25, 5, 0.45),
      0 4px 10px rgba(40, 25, 5, 0.3);
  }
  /* soft painted wash over the page, like a gouache illustration */
  .notebook::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    pointer-events: none;
    background:
      radial-gradient(ellipse 40% 28% at 20% 14%, rgba(150, 175, 140, 0.08), transparent 70%),
      radial-gradient(ellipse 45% 30% at 80% 80%, rgba(222, 168, 120, 0.08), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 50%, transparent 60%, rgba(120, 85, 40, 0.10) 100%);
  }
  /* left page edge shading, like a bound book */
  .notebook::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 26px;
    background: linear-gradient(90deg, rgba(90, 65, 30, 0.22), rgba(90, 65, 30, 0.06) 60%, transparent);
    border-radius: 6px 0 0 6px;
    pointer-events: none;
  }
  /* ruled lines */
  .page {
    position: relative;
    padding: 34px 34px 26px 76px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0, transparent 35px,
      var(--rule) 35px, var(--rule) 36px
    );
    background-position: 0 8px;
  }
  /* red margin line */
  .page::before {
    content: "";
    position: absolute;
    left: 60px; top: 0; bottom: 0;
    width: 1.5px;
    background: rgba(194, 85, 79, 0.55);
    pointer-events: none;
  }

  .binding {
    position: absolute;
    top: 16px;
    bottom: 16px;
    left: -9px;
    width: 18px;
    background-image: radial-gradient(circle at 50% 50%,
      var(--paper) 3.5px,
      transparent 3.5px,
      transparent 4.5px,
      var(--pencil) 4.5px,
      var(--pencil) 6.5px,
      rgba(0,0,0,0.35) 7px,
      transparent 7.5px);
    background-size: 18px 30px;
    background-repeat: repeat-y;
    z-index: 2;
  }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 4px;
    margin-bottom: 18px;
  }
  .head h1 {
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--ink);
  }
  .status-toggle {
    display: flex;
    gap: 9px;
    flex-shrink: 0;
    filter: url(#handDrawnNoise);
  }
  .st {
    position: relative;
    cursor: pointer;
    user-select: none;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 2px 0;
    border-bottom: 2px solid transparent;
    transition: color 0.2s ease;
  }
  .st:hover { color: var(--ink); }
  .st input { position: absolute; opacity: 0; pointer-events: none; }
  .st.on { color: var(--ink); border-bottom-color: var(--red); }

  /* --- Write a new entry --- */
  .composer-note {
    position: relative;
    max-width: 500px;
    margin: 0 auto 36px;
    padding: 20px 24px 22px;
    background: linear-gradient(180deg, #fdf0b8, #f7e29e);
    border-radius: 4px;
    box-shadow:
      0 16px 34px rgba(40, 25, 5, 0.42),
      0 3px 8px rgba(40, 25, 5, 0.28);
    transform: rotate(-1.8deg);
    animation: settle 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) 0.15s both;
  }
  /* little tape strip holding the sticky note */
  .composer-note::before {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    width: 92px;
    height: 24px;
    transform: translateX(-50%) rotate(2deg);
    background: rgba(255, 252, 240, 0.55);
    border-left: 1px dashed rgba(120, 90, 40, 0.25);
    border-right: 1px dashed rgba(120, 90, 40, 0.25);
    box-shadow: 0 1px 3px rgba(40, 25, 5, 0.18);
  }
  .entry-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .entry-row input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Courier Prime', monospace;
    font-size: 19px;
    font-weight: 400;
    color: var(--ink);
    padding: 2px 4px;
    border-bottom: 1.5px dashed rgba(51, 51, 51, 0.4);
  }
  .entry-row input::placeholder { color: var(--ink-soft); font-weight: 400; }
  .add-btn {
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--green);
    border: none;
    cursor: pointer;
    border-radius: 999px;
    padding: 4px 18px 6px;
    box-shadow: 0 2px 5px rgba(40, 25, 5, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(40, 25, 5, 0.4); }
  .add-btn:active { transform: translateY(0); }

  /* --- Task entries --- */
  .list { display: flex; flex-direction: column; }

  .task {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 2px 0;
    animation: writeIn 0.3s ease both;
  }
  @keyframes writeIn {
    from { opacity: 0; transform: translateY(6px) rotate(-0.8deg); }
    to   { opacity: 1; transform: translateY(0) rotate(0); }
  }
  /* === Hand-drawn task text (Uiverse.io by AatreyuShau, adapted) === */
  .task-text {
    position: relative;
    flex: 1;
    min-width: 0;
    display: inline-block;
    font-family: "Courier Prime", "Courier New", monospace;
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--ink);
    word-break: break-word;
    filter: url(#handDrawnNoise);
    transition: color 0.3s ease;
  }
  .task.done .task-text { color: #222222aa; }
  .task-text .cut-line {
    position: absolute;
    left: -2px;
    bottom: 18%;
    height: 1em;
    width: calc(100% + 15px);
    pointer-events: none;
    stroke: #333;
    stroke-width: 2;
    fill: none;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
  }
  .task.done .task-text .cut-line { transform: scaleX(1); }
  .task.done .check { border-color: var(--green); transform: rotate(-4deg); }
  .task.done .check svg { opacity: 1; }

  .del {
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'Courier Prime', monospace;
    font-size: 20px;
    color: var(--ink-soft);
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    opacity: 0;
    transition: all 0.15s ease;
  }
  .task:hover .del { opacity: 1; }
  .del:hover { color: var(--red); background: rgba(194, 85, 79, 0.12); }

  .empty {
    font-family: 'Courier Prime', monospace;
    font-size: 16px;
    color: var(--ink-soft);
    padding: 10px 0 6px;
  }

  /* --- Page footer --- */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 10px;
    border-top: 2px solid var(--ink);
    font-family: 'Courier Prime', monospace;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .foot .progress-track {
    width: 40%;
    height: 5px;
    border-radius: 999px;
    background: rgba(52, 64, 107, 0.15);
    overflow: hidden;
  }
  .foot .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--green);
    transition: width 0.35s ease;
  }
  .clear-btn {
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
  }
  .clear-btn:hover { color: var(--red); }

  .signature {
    text-align: center;
    margin-top: 20px;
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    font-weight: 300;
    color: rgba(255, 250, 240, 0.85);
    text-shadow: 0 1px 4px rgba(40, 25, 5, 0.6);
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="handDrawnNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
    </filter>
  </svg>
  <div class="desk"></div>
  <div class="motes" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="steam" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="wrap">
    <div class="composer-note">
      <div class="entry-row">
        <input type="text" id="taskInput" placeholder="Write a new task..." autocomplete="off" maxlength="140">
        <button class="add-btn" id="addBtn">Add</button>
      </div>
    </div>

    <div class="notebook">
      <div class="binding"></div>
      <div class="page">
        <div class="head">
          <h1>My Tasks</h1>
        </div>

        <div class="list" id="list"></div>

        <div class="foot" id="stats" style="display:none;">
          <span id="statText">0 of 0 done</span>
          <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
          <button class="clear-btn" id="clearDone">Clear done</button>
        </div>
      </div>
    </div>

    <div class="signature">— tasks are saved in your browser —</div>
  </div>

<script>
(function () {
  var STORAGE_KEY = 'tasktracker-v1';

  var tasks = load();

  var listEl = document.getElementById('list');
  var inputEl = document.getElementById('taskInput');
  var statsEl = document.getElementById('stats');
  var statTextEl = document.getElementById('statText');
  var progressFillEl = document.getElementById('progressFill');

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return [
          { id: 't1', name: 'Example task — use To do, Doing or Done on the right', status: 'TO_DO' },
          { id: 't2', name: 'Another task — hover and press × to delete', status: 'IN_PROGRESS' }
        ];
      }
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.map(function (t) {
        return { id: t.id, name: t.name, status: t.status || (t.done ? 'DONE' : 'TO_DO') };
      });
    } catch (e) { return []; }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function uid() { return 't' + Date.now() + Math.random().toString(36).slice(2, 7); }

  function render() {
    listEl.innerHTML = '';

    if (tasks.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'The page is empty — write your first task above.';
      listEl.appendChild(empty);
    }

    tasks.forEach(function (t) {
      var row = document.createElement('div');
      row.className = 'task' + (t.status === 'DONE' ? ' done' : '');

      var text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = t.name;
      var cut = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      cut.setAttribute('class', 'cut-line');
      cut.setAttribute('viewBox', '0 0 100 20');
      cut.setAttribute('preserveAspectRatio', 'none');
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M2 12 Q 12 5 22 12 T 42 12 T 62 12 T 82 12 T 98 10');
      cut.appendChild(path);
      text.appendChild(cut);

      var toggle = document.createElement('div');
      toggle.className = 'status-toggle';
      ['TO_DO', 'IN_PROGRESS', 'DONE'].forEach(function (s) {
        var lab = document.createElement('label');
        lab.className = 'st' + (t.status === s ? ' on' : '');
        var r = document.createElement('input');
        r.type = 'radio';
        r.name = 'st-' + t.id;
        r.checked = t.status === s;
        r.setAttribute('aria-label', 'Status: ' + s);
        r.addEventListener('change', function () { setStatus(t.id, s); });
        lab.appendChild(r);
        lab.appendChild(document.createTextNode(s === 'TO_DO' ? 'To do' : (s === 'IN_PROGRESS' ? 'Doing' : 'Done')));
        toggle.appendChild(lab);
      });

      var del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', 'Delete task');
      del.textContent = '×';
      del.addEventListener('click', function () { remove(t.id); });

      row.appendChild(text);
      row.appendChild(toggle);
      row.appendChild(del);
      listEl.appendChild(row);
    });

    var doneCount = tasks.filter(function (t) { return t.status === 'DONE'; }).length;
    var total = tasks.length;
    statsEl.style.display = total ? 'flex' : 'none';
    statTextEl.textContent = doneCount + ' of ' + total + ' done';
    progressFillEl.style.width = total ? Math.round(doneCount / total * 100) + '%' : '0%';
  }

  function add() {
    var text = inputEl.value.trim();
    if (!text) return;
    tasks.unshift({ id: uid(), name: text, status: 'TO_DO' });
    inputEl.value = '';
    save();
    render();
  }

  function setStatus(id, status) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) { tasks[i].status = status; break; }
    }
    save();
    render();
  }

  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  document.getElementById('addBtn').addEventListener('click', add);
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });


  document.getElementById('clearDone').addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
